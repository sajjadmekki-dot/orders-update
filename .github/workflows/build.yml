name: Build APK
on:
  push:
    branches: [ main, apk ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk morattib-orders.apk
      - uses: actions/upload-artifact@v4
        with:
          name: morattib-orders-apk
          path: morattib-orders.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مرتّب الطلبات ${{ github.run_number }}
          body: "نزّل ملف morattib-orders.apk ونصبه على الموبايل."
          files: morattib-orders.apk
